name: Windows RDP Lab

# push එකකදී හෝ Actions tab එකේ "Run workflow" ඔබපු වෙලාවට run වෙනවා
on: [push, workflow_dispatch]

# එක වෙලාවේ run එකකට වඩා යන්න දෙන්නේ නෑ (quota save වෙනවා)
concurrency:
  group: rdp-lab
  cancel-in-progress: false

env:
  # Runner එක කොච්චර වෙලාවක් තියාගන්නවද කියන එක. GitHub max = 360 min (පැය 6).
  # ඕන වෙලාවක Actions tab එකෙන් "Cancel workflow" දාලා කලින්ම නවත්තන්න පුළුවන්.
  KEEP_ALIVE_MINUTES: "340"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # (Get-ComputerInfo භාවිතා කළේ නෑ — ඒක මිනිත්තු ගානක් යනවා. මේක වේගවත්.)
      - name: Show runner info
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Runner : $env:RUNNER_NAME"
          Write-Host "OS     : $($os.Caption) ($($os.Version))"
          Write-Host "CPU    : $([Environment]::ProcessorCount) cores"
          Write-Host "RAM    : $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)) GB"
          Write-Host "Disk   : $([math]::Round((Get-PSDrive C).Free/1GB,1)) GB free"

      # --- FIX: ඔයාගේ original එකේ Expand-Archive වලට DestinationPath නැති නිසා
      # --- ngrok.exe යන්නේ C:\ngrok.exe ටයි. .\ngrok\ngrok.exe කියන path එක වැරදියි.
      - name: Download ngrok
        shell: pwsh
        run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

      - name: Extract ngrok
        shell: pwsh
        run: Expand-Archive ngrok.zip -DestinationPath .\ngrok -Force

      - name: ngrok Auth
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN

      - name: Enable Remote Desktop
        shell: pwsh
        run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

      - name: Open firewall
        shell: pwsh
        run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Require NLA (Network Level Authentication)
        shell: pwsh
        run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      # --- FIX: password එක code එකේම තිබුණා (P@ssw0rd!). දැන්:
      #     1) RDP_PASSWORD secret එකක් තිබ්බොත් ඒක පාවිච්චි කරනවා
      #     2) නැත්නම් ශක්තිමත් random එකක් හදලා log එකට දානවා (VM එක නැවතුණේ නෑ)
      # --- Repo -> Settings -> Secrets and variables -> Actions -> RDP_PASSWORD
      - name: Set RDP password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $pw = $Env:RDP_PASSWORD
          if ([string]::IsNullOrEmpty($pw)) {
            Write-Host "⚠️  RDP_PASSWORD secret එකක් නෑ — random එකක් හදනවා."
            Write-Host "   (හැම run එකකටම වෙනස් වෙනවා. Permanent එකක් ඕන නම් Secret එකක් දාන්න.)"
            $chars  = 'ABCDEFGHJKMNPQRSTUVWXYZ'
            $lower  = 'abcdefghijkmnpqrstuvwxyz'
            $digits = '23456789'
            $syms   = '!@#$%&*_+-='
            $pw = -join ((1..3 | % { $chars[(Get-Random -Max $chars.Length)] }) +
                         (1..4 | % { $lower[(Get-Random -Max $lower.Length)] }) +
                         (1..3 | % { $digits[(Get-Random -Max $digits.Length)] }) +
                         (1..2 | % { $syms[(Get-Random -Max $syms.Length)] }) |
                         Get-Random -Count 12)
          }
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText $pw -Force)
          # tunnel step එකෙන් පේන්න මේක file එකකට තියාගන්නවා (VM එක ඇතුළේ විතරයි)
          $pw | Out-File -FilePath "$env:RUNNER_TEMP\rdp_pw.txt" -Encoding ascii -NoNewline
          Write-Host "✅ runneradmin password එක set කරා."

      # --- Optional: ඔයාගේ project files මුලින්ම clone කරගන්න (academic repo එකක් නම්)
      # - name: Checkout my project
      #   uses: actions/checkout@v4
      #   with:
      #     path: project

      # --- ngrok start කරලා tunnel URL එක Actions log එකටම දානවා.
      # --- කලින් වගේ 4040 dashboard එක හොයාගන්න ඕන නෑ.
      - name: Create tunnel & print URL
        shell: pwsh
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp","3389","--log","ngrok.log","--log-format","logfmt"
          $url = ""
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              # -SkipHttpErrorCheck pwsh 7+ විතරයි (GitHub runner එකේ pwsh 7 තියෙනවා)
              $r = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels -TimeoutSec 5 -SkipHttpErrorCheck
              if ($r.tunnels -and $r.tunnels.Count -gt 0) { $url = $r.tunnels[0].public_url; break }
            } catch { }   # ngrok තාම start වෙලා නෑ — ආයෙත් try කරනවා
          }
          if (-not $url) {
            # exit කරන්නේ නෑ! නැත්තම් job එක නැවතිලා VM එක මැකෙනවා.
            # VM එක ජීවත් වෙන්න හැරියොත් ngrok.exe ක manual run කරලා හදාගන්න පුළුවන්.
            Write-Host "⚠️  ngrok tunnel එක හැදුනේ නෑ. ngrok.log එක මෙන්න:"
            Get-Content ngrok.log -ErrorAction SilentlyContinue
            Write-Host "VM එක තවමත් ජීවත් වෙනවා — RDP එකෙන් ගිහින් ngrok.exe manual run කරන්න."
            exit 0
          }

          $pw = (Get-Content "$env:RUNNER_TEMP\rdp_pw.txt" -Raw).Trim()
          $host_, $port = $url -replace "tcp://","" -split ":"
          Write-Host ""
          Write-Host "================= RDP CONNECTION DETAILS ================="
          Write-Host ("  Address   : {0}" -f $host_)
          Write-Host ("  Port      : {0}" -f $port)
          Write-Host ("  Username  : runneradmin")
          Write-Host ("  Password  : {0}" -f $pw)
          Write-Host ("  mstsc     : mstsc.exe /v:{0}:{1}" -f $host_, $port)
          Write-Host "=========================================================="
          Write-Host ""

          # Job Summary එකටත් දානවා (Actions run page එකේ පේනවා)
          $md = @(
            '## 🖥️ RDP Lab ready',
            '',
            ('| Field | Value |'),
            ('|---|---|'),
            ('| ngrok URL | `' + $url + '` |'),
            ('| Address | `' + $host_ + '` |'),
            ('| Port | `' + $port + '` |'),
            ('| Username | `runneradmin` |'),
            ('| Password | `' + $pw + '` |'),
            '',
            ('**Connect:** `mstsc.exe /v:' + $host_ + ':' + $port + '`')
          ) -join "`n"
          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # --- මේක නැත්තම් job එක වහාම ඉවර වෙලා VM එක මකලා දානවා!
      - name: Keep the runner alive
        shell: pwsh
        run: |
          Write-Host "Runner එක $env:KEEP_ALIVE_MINUTES මිනිත්තු තියාගන්නවා..."
          Start-Sleep -Seconds ([int]$env:KEEP_ALIVE_MINUTES * 60)
